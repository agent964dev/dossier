<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <title>خُطَّةُ أَرْبِيل</title>
  </head>
  <body>
    <h1>مَرْحَبًا بِكُمْ فِي إِرْبِيل</h1>
    <p>نَبْدَأُ التَّوْصِيلَ إِلَى أَرْبِيل وَالْبَصْرَة فِي تِشْرِين الثَّانِي — آخِر مَوْعِد ٱلْخَمِيس.</p>
    <p>كـــتـــاب</p>
  </body>
</html>
