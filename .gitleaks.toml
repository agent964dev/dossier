title = "Dossier gitleaks configuration"

[extend]
useDefault = true

[allowlist]
description = "Allow fixtures and a historical storage-key false positive"
paths = [
  '''^docs/plan-playground\.html$''',
  '''^apps/web/test/.*$''',
  '''^packages/cli/src/[^/]*\.test\.ts$''',
  '''^packages/cli/test/.*$''',
]
# The Worker test pool's fixed secrets in apps/web/vitest.config.ts.
regexes = [
  '''^test-(handle-)?secret-0123456789abcdef(0123456789abcdef)?$''',
]
