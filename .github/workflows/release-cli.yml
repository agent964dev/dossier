name: Release CLI

on:
  push:
    tags:
      - 'cli-v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-cli
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install npm with trusted publishing support
        run: npm install -g npm@11.5.1

      - name: Verify release tag
        run: |
          TAG=${GITHUB_REF_NAME#cli-v}
          PKG=$(node -p "require('./packages/cli/package.json').version")
          [ "$TAG" = "$PKG" ] || exit 1
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || exit 1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build CLI
        run: bun run --cwd packages/cli build

      - name: Publish CLI
        run: cd packages/cli && npm publish --access public --provenance
