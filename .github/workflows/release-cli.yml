name: Production release

on:
  push:
    branches: [main]

permissions:
  contents: read

# Covers CI, migrations, deployment, verification AND publication. A later
# merge never cancels a running release. See the runbook for queue limits.
concurrency:
  group: dossier-production
  cancel-in-progress: false
  queue: max

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    needs: ci
    if: github.repository == 'agent964dev/dossier' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://dossier.agent964.com
    permissions:
      contents: read
      deployments: read
    outputs:
      shipped: ${{ steps.freshness.outputs.ship }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Reject stale releases, including reruns
        id: freshness
        run: node scripts/release/freshness.mjs
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Require completed production setup
        if: steps.freshness.outputs.ship == 'true'
        env:
          BUILDS_DISABLED: ${{ vars.WORKERS_BUILDS_DISABLED }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test "$BUILDS_DISABLED" = true || { echo 'Confirm Workers Builds is disconnected; see docs/RUNBOOK.md'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing production CLOUDFLARE_ACCOUNT_ID variable'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing production CLOUDFLARE_API_TOKEN secret'; exit 1; }

      - uses: oven-sh/setup-bun@v2
        if: steps.freshness.outputs.ship == 'true'
        with:
          bun-version-file: package.json

      - name: Install and build the exact tested production revision
        if: steps.freshness.outputs.ship == 'true'
        env:
          DOSSIER_BUILD_VERSION: ${{ github.sha }}
        run: |
          bun install --frozen-lockfile
          env -u CLOUDFLARE_ENV bun run --cwd apps/web build
          node scripts/release/verify.mjs config apps/web/dist/server/wrangler.json

      - name: Check prerequisite secret names
        if: steps.freshness.outputs.ship == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cd apps/web
          bunx --no-install wrangler secret list --config wrangler.jsonc > "$RUNNER_TEMP/dossier-secret-names.json"
          node ../../scripts/release/verify.mjs secrets "$RUNNER_TEMP/dossier-secret-names.json"

      - name: Apply production migrations, then deploy
        if: steps.freshness.outputs.ship == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash scripts/release/deploy.sh

      - name: Verify production SHA and capabilities
        if: steps.freshness.outputs.ship == 'true'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/release/verify.mjs smoke "$EXPECTED_SHA"

  publish:
    needs: deploy
    if: needs.deploy.outputs.shipped == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      deployments: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
          # No registry-url: do not generate token-based npm authentication.

      - name: Reject stale publication reruns
        id: freshness
        run: node scripts/release/freshness.mjs
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Decide whether the explicit version is unpublished
        if: steps.freshness.outputs.ship == 'true'
        id: registry
        run: node scripts/release/registry.mjs

      - uses: oven-sh/setup-bun@v2
        if: steps.registry.outputs.publish == 'true'
        with:
          bun-version-file: package.json

      - name: Build CLI and prepare supported npm
        if: steps.registry.outputs.publish == 'true'
        run: |
          npm install --global npm@11.19.1
          bun install --frozen-lockfile
          bun run --cwd packages/cli build

      - name: Reverify production and publish with OIDC and provenance
        if: steps.registry.outputs.publish == 'true'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          node scripts/release/verify.mjs smoke "$EXPECTED_SHA"
          cd packages/cli
          npm publish --access public --provenance --ignore-scripts --registry=https://registry.npmjs.org
