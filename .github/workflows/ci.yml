name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # PR updates cancel obsolete checks. Main CI is called by the serialized
  # release coordinator and has an independent group for each run/attempt.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test release safeguards
        run: node --test scripts/release/*.test.mjs

      - name: Require a version bump for changed CLI payloads
        run: node scripts/release/cli-version.mjs
        env:
          RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          RELEASE_HEAD_SHA: ${{ github.sha }}

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Typecheck browser runtime
        run: bun run --cwd apps/web typecheck:runtime

      - name: Test
        run: bun run test

      - name: Build web app
        run: env -u CLOUDFLARE_ENV bun run --cwd apps/web build
        env:
          DOSSIER_BUILD_VERSION: ${{ github.sha }}

      - name: Build CLI
        run: bun run --cwd packages/cli build

      - name: Pack and smoke test CLI
        run: |
          mkdir -p /tmp/pack /tmp/smoke
          cd packages/cli
          npm pack --pack-destination /tmp/pack
          cd /tmp/smoke
          npm init -y >/dev/null
          npm install /tmp/pack/*.tgz
          test -s ./node_modules/@agent964/dossier/README.md
          test -s ./node_modules/@agent964/dossier/skills/dossier/SKILL.md
          ./node_modules/.bin/dossier --version
          ./node_modules/.bin/dossier --help >/dev/null
          unset DOSSIER_UPDATE_REGISTRY_URL
          ./node_modules/.bin/dossier update --check --json

  browser:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bun run --cwd apps/web playwright install --with-deps chromium

      # The dev server reads its secrets from .dev.vars. They are generated per
      # run: the suite seeds its own workspace and signs its own session, so
      # nothing here has to match a deployment.
      - name: Write dev vars for the browser suite
        run: |
          {
            printf 'PUBLIC_BASE_URL=http://localhost:8790\n'
            printf 'SESSION_SECRET=%s\n' "$(openssl rand -hex 32)"
            printf 'LINK_SECRET=%s\n' "$(openssl rand -hex 32)"
            printf 'BOOTSTRAP_API_KEY=%s\n' "$(openssl rand -hex 32)"
          } > apps/web/.dev.vars

      - name: Browser tests
        run: bun run --cwd apps/web test:browser
        env:
          PLAYWRIGHT_PORT: 8790
          DOSSIER_PERSIST_PATH: .wrangler/state-browser

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-pinned Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_LINUX_X64_SHA256: >-
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive=/tmp/gitleaks.tar.gz
          release_url=https://github.com/gitleaks/gitleaks/releases/download
          asset=gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "${release_url}/v${GITLEAKS_VERSION}/${asset}"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" | \
            sha256sum --check
          mkdir -p /tmp/gitleaks
          tar -xzf "$archive" -C /tmp/gitleaks gitleaks

      - name: Scan redacted repository history
        run: |
          /tmp/gitleaks/gitleaks git \
            --config .gitleaks.toml \
            --log-opts='--all' \
            --redact \
            --verbose \
            .
