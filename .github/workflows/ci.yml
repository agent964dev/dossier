name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build web app
        run: bun run --cwd apps/web build

      - name: Build CLI
        run: bun run --cwd packages/cli build

      - name: Pack and smoke test CLI
        run: |
          mkdir -p /tmp/pack /tmp/smoke
          cd packages/cli
          npm pack --pack-destination /tmp/pack
          cd /tmp/smoke
          npm init -y >/dev/null
          npm install /tmp/pack/*.tgz
          test -s ./node_modules/@agent964/dossier/README.md
          ./node_modules/.bin/dossier --version
          ./node_modules/.bin/dossier --help >/dev/null
          unset DOSSIER_UPDATE_REGISTRY_URL
          ./node_modules/.bin/dossier update --check --json

  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install checksum-pinned Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_LINUX_X64_SHA256: >-
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive=/tmp/gitleaks.tar.gz
          release_url=https://github.com/gitleaks/gitleaks/releases/download
          asset=gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "${release_url}/v${GITLEAKS_VERSION}/${asset}"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" | \
            sha256sum --check
          mkdir -p /tmp/gitleaks
          tar -xzf "$archive" -C /tmp/gitleaks gitleaks

      - name: Scan redacted repository history
        run: |
          /tmp/gitleaks/gitleaks git \
            --config .gitleaks.toml \
            --log-opts='--all' \
            --redact \
            --verbose \
            .
