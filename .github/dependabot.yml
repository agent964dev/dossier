version: 2

updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Baghdad
    open-pull-requests-limit: 5
    groups:
      workspace-dependencies:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Baghdad
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'
