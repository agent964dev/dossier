<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dossier allowlisted embed probe</title>
  <script>
    globalThis.__dossierCspViolations = [];
    addEventListener('securitypolicyviolation', function (event) {
      globalThis.__dossierCspViolations.push({
        blockedURI: event.blockedURI,
        effectiveDirective: event.effectiveDirective,
        originalPolicy: event.originalPolicy,
        violatedDirective: event.violatedDirective
      });
    });
    addEventListener('DOMContentLoaded', function () {
      var frame = document.createElement('iframe');
      frame.id = 'blocked-frame';
      frame.title = 'Blocked non-allowlisted frame';
      frame.src = '{{BLOCKED_URL}}';
      document.body.appendChild(frame);
    });
  </script>
</head>
<body>
  <iframe id="allowlisted-frame" src="{{ALLOWED_URL}}" title="Allowlisted external frame"></iframe>
</body>
</html>
