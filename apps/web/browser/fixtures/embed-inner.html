<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Dossier nested frame probe</title></head>
<body>
  <p id="inner-status">starting</p>
  <script>
    (function () {
      var cookieResult;
      try {
        cookieResult = { value: document.cookie, error: null };
      } catch (error) {
        cookieResult = { value: null, error: error.name + ': ' + error.message };
      }
      var parentReadable;
      try {
        void parent.document.title;
        parentReadable = true;
      } catch (error) {
        parentReadable = false;
      }
      globalThis.__dossierInnerProbe = {
        scriptRan: true,
        origin: window.origin,
        cookieResult: cookieResult,
        parentReadable: parentReadable
      };
      document.getElementById('inner-status').textContent = 'inner script ran';
    })();
  </script>
</body>
</html>
